<!DOCTYPE html>
<html>
<head>
    <title>Upload PDF</title>

    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #79a24b);
            margin: 0;
            height: 98vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .upload-container {
            width: 380px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h2 {
            color: white;
            margin-bottom: 20px;
        }

        /* File input */
        input[type="file"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px dashed rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="file"]:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Upload button */
        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124,58,237,0.5);
        }

        /* Link */
        a {
            display: inline-block;
            margin-top: 15px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
            transition: 0.3s;
        }

        a:hover {
            opacity: 1;
        }

        /* Small hint text */
        .hint {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-top: 8px;
        }


        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 14px 10px;
            text-align: center;
            color: white;
            font-size: 13px;

            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);

            border-top: 1px solid rgba(255,255,255,0.2);

            overflow: hidden;
        }

        /* 🌈 Animated glowing border */
        .footer::before {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 2px;

            background: linear-gradient(
                90deg,
                #ff00cc,
                #3333ff,
                #00ffcc,
                #ffcc00,
                #ff00cc
            );

            animation: glowMove 4s linear infinite;
        }

        /* Animation */
        @keyframes glowMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(50%); }
        }

        /* Text styling */
        .footer-content .logo {
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 2px;
        }

        /* ✨ subtle glow text */
        .footer strong {
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.8),
                         0 0 10px rgba(124,58,237,0.8),
                         0 0 15px rgba(124,58,237,0.6);
        }



    </style>
</head>

<body>

<div class="upload-container">

    <h2>📄 Upload your PDF</h2>

    <form id="uploadForm">
        <input type="file" name="file" required />
        <div class="hint">Drag & drop or click to select a PDF</div>
        <button type="submit">Upload File</button>
    </form>

    <a href="/chat">→ Go to Chat</a>

</div>



<footer class="footer">
    <div class="footer-content">
        <span class="logo">🚀 CHATBOT </span>
        <p>Designed by <strong>OTG Chennai</strong></p>
    </div>
</footer>

<script>



document.getElementById("uploadForm").onsubmit = async (e) => {
    e.preventDefault();

    let form = e.target;
    let formData = new FormData(form);

    let res = await fetch("/upload_pdf", {
        method: "POST",
        body: formData
    });

    let message = await res.text();
    alert(message);

    // ✅ Reset form
    form.reset();
};  // 🔥 IMPORTANT: close function


</script>

</body>
</html>
