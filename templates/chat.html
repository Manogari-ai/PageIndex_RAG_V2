<!DOCTYPE html>
<html>
<head>
    <title>ChatBot</title>

    <style>

	body {
	    font-family: 'Inter', Arial, sans-serif;
	    background: linear-gradient(135deg, #667eea, #79a24b);
	    margin: 0;
	    height: 100vh;
	}

	/* Main container */
	.chat-container {
	    width: 55%;
	    margin: auto;
	    margin-top: 40px;
	    background: rgba(255, 255, 255, 0.15);
	    backdrop-filter: blur(20px);
	    border-radius: 20px;
	    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
	    display: flex;
	    flex-direction: column;
	    overflow: hidden;
	    border: 1px solid rgba(255,255,255,0.2);
	}

	/* Header */
	.chat-container h2 {
	    margin: 0;
	    padding: 18px;
	    background: linear-gradient(90deg, #4f46e5, #7c3aed);
	    color: white;
	    font-size: 18px;
	    letter-spacing: 0.5px;
	    text-align: center;
	}

	/* Chat box */
	#chat-box {
	    height: 420px;
	    overflow-y: auto;
	    padding: 20px;
	    display: flex;
	    flex-direction: column;
	    gap: 8px;
	}

	/* Scrollbar styling */
	#chat-box::-webkit-scrollbar {
	    width: 6px;
	}
	#chat-box::-webkit-scrollbar-thumb {
	    background: rgba(255,255,255,0.3);
	    border-radius: 10px;
	}

	/* User bubble */
	.user {
	    align-self: flex-end;
	    background: linear-gradient(135deg, #4f46e5, #6366f1);
	    color: white;
	    padding: 12px 16px;
	    border-radius: 18px 18px 4px 18px;
	    max-width: 70%;
	    font-size: 14px;
	    box-shadow: 0 5px 15px rgba(79,70,229,0.4);
	    animation: fadeIn 0.3s ease;
	}

	/* Bot bubble */
	.bot {
	    align-self: flex-start;
	    background: rgba(255,255,255,0.9);
	    color: #111827;
	    padding: 12px 16px;
	    border-radius: 18px 18px 18px 4px;
	    max-width: 70%;
	    font-size: 14px;
	    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
	    animation: fadeIn 0.3s ease;
	}

	/* Loading */
	.loading {
	    font-style: italic;
	    color: #fbbf24;
	}

	/* Input section */
	input {
	    width: 75%;
	    padding: 14px;
	    border: none;
	    outline: none;
	    font-size: 14px;
	    border-radius: 12px;
	    margin: 10px;
	}

	/* Button */
	button {
	    padding: 14px 18px;
	    border: none;
	    border-radius: 12px;
	    background: linear-gradient(135deg, #4f46e5, #7c3aed);
	    color: white;
	    cursor: pointer;
	    transition: all 0.3s ease;
	}

	button:hover {
	    transform: scale(1.05);
	    box-shadow: 0 8px 20px rgba(124,58,237,0.5);
	}

	/* Bottom link */
	a {
	    text-align: center;
	    padding: 12px;
	    font-size: 13px;
	    color: white;
	    text-decoration: none;
	    opacity: 0.8;
	}

	a:hover {
	    opacity: 1;
	}

	/* Animation */
	@keyframes fadeIn {
	    from {
	        opacity: 0;
	        transform: translateY(8px);
	    }
	    to {
	        opacity: 1;
	        transform: translateY(0);
	    }
	}

    </style>
</head>

<body>

<div class="chat-container">

    <h2>📄 ChatBot</h2>

    <div id="chat-box"></div>

    <input type="text" id="question" placeholder="Ask something..." />
    <button id="askBtn">Ask</button>

    <br><br>
    <a href="/upload">⬅ Upload another PDF</a>

</div>




<script>
let chatBox = document.getElementById("chat-box");
let input = document.getElementById("question");
let btn = document.getElementById("askBtn");

// 🔒 Global lock
let isProcessing = false;

// ❌ Prevent Enter spam
input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault(); // stop default
        if (!isProcessing) {
            ask();
        }
    }
});

// ❌ Prevent multiple clicks
btn.onclick = function () {
    if (isProcessing) return;
    ask();
};

async function ask() {
    // 🔒 Double safety check
    if (isProcessing) return;

    let question = input.value.trim();
    if (!question) return;

    // 🔒 LOCK EVERYTHING
    isProcessing = true;

    btn.disabled = true;
    btn.style.pointerEvents = "none";   // 🔥 force disable clicks
    input.disabled = true;

    // user message
    chatBox.innerHTML += `<div class="user">🧑 You: ${question}</div>`;
    input.value = "";

    // loading
    let loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `<div id="${loadingId}" class="loading">⏳ Thinking...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        let res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ query: question })
        });

        let data = await res.json();

        document.getElementById(loadingId).remove();

        chatBox.innerHTML += `<div class="bot">🤖 AI: ${data.answer}</div>`;

    } catch (err) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="bot">❌ Error: ${err.message}</div>`;
    }

    // 🔓 UNLOCK
    isProcessing = false;

    btn.disabled = false;
    btn.style.pointerEvents = "auto";
    input.disabled = false;

    input.focus();
    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
